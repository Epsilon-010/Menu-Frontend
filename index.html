<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Self service digital menu for restaurants: tables order on their own and the kitchen gets every order at once." />
    <meta name="robots" content="noindex" />
    <!-- Table QR links carry their token in the URL: never send it to another site in the Referer. -->
    <meta name="referrer" content="same-origin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist loads from src/app/appFonts.ts without blocking the first paint (no inline handler: see the CSP). -->
    <script type="module" src="/src/app/appFonts.ts"></script>
    <title>Menu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
