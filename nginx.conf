server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No nginx version in error pages or the Server header.
    server_tokens off;
    # The API only takes small JSON bodies; images go straight from the browser to Cloudinary.
    client_max_body_size 1m;

    # Security headers for every response (no location below declares add_header, so all of them inherit these).
    # External origins: Google Fonts (stylesheets and font files) and Cloudinary (image delivery and signed uploads).
    # Styles allow 'unsafe-inline' because the menu's theme is applied with inline CSS variables (style attributes).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://res.cloudinary.com data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # Table QR links carry their token in the URL: never send it to another site in the Referer.
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Live updates (Server-Sent Events) for tables and staff: one long response, passed on event by event.
    # The API sends a keep-alive comment while idle and ends the stream every few minutes.
    location ~ ^/api/v1/(table|staff)/events$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwritten, never appended: the API must not see a client-chosen X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 360s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwritten, never appended: the API must not see a client-chosen X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events need an unbuffered stream.
        proxy_buffering off;
    }

    # Client-side routing: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
